name: sinclair_tracker
description: 'Inoffizieller Tracker für John-Sinclair-Hörspiele'

publish_to: 'none'

version: 1.1.1+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  file_picker: ^8.0.3
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  provider: ^6.0.0
  http: ^1.3.0
  html: ^0.15.6
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
