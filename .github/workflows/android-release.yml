name: Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Restore release signing
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_BUNDLE_BASE64"
          printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode | tar -xz -C android
          test -s android/app/sinclair-tracker-release.jks
          test -s android/key.properties
          chmod 600 android/app/sinclair-tracker-release.jks android/key.properties

      - name: Build release APK
        run: flutter build apk --flavor standard --release --no-pub

      - name: Prepare and verify release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-standard-release.apk release/Sinclair-Tracker-v1.1.1.apk
          cd release
          sha256sum Sinclair-Tracker-v1.1.1.apk > Sinclair-Tracker-v1.1.1.apk.sha256
          unzip -t Sinclair-Tracker-v1.1.1.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Sinclair-Tracker-v1.1.1.apk

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sinclair-Tracker-v1.1.1
          path: |
            release/Sinclair-Tracker-v1.1.1.apk
            release/Sinclair-Tracker-v1.1.1.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.1 \
            release/Sinclair-Tracker-v1.1.1.apk \
            release/Sinclair-Tracker-v1.1.1.apk.sha256 \
            --title "Sinclair Tracker v1.1.1" \
            --notes-file RELEASE_NOTES_v1.1.1.md

      - name: Remove signing material
        if: always()
        run: rm -f android/app/sinclair-tracker-release.jks android/key.properties
